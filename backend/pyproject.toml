[project]
name = "resume-chatbot"
version = "0.1.0"
description = "Backend for the resume chatbot"
authors = [
    { name = "Karush Pradhan", email = "karushpradhan@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.12.0",
    "flask>=3.1.2",
    "flask-cors>=4.0.0",
    "langchain>=0.3.27",
    "langchain-cohere>=0.4.6",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "config"]
